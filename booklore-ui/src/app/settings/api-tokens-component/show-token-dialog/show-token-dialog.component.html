<div class="p-6 flex flex-col gap-4 w-96">
  <h3 class="font-semibold text-lg">Your New API Token</h3>
  <p class="text-sm text-gray-600">
    Copy this token now. It will not be shown again.
  </p>

  <div class="flex gap-2 items-center">
    <input
      type="text"
      [value]="tokenValue"
      readonly
      pInputText
      class="w-full font-mono text-sm"
    />
    <p-button
      icon="pi pi-copy"
      [text]="true"
      (onClick)="copyToken()"
      pTooltip="Copy token"
      tooltipPosition="top"
    ></p-button>
  </div>

  <div class="flex justify-end mt-4">
    <p-button label="Close" (onClick)="closeDialog()"></p-button>
  </div>
</div>
